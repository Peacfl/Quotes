<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Quotes Generator</title>

    <!--stylesheet-->
    <link rel="stylesheet" href="style.css">

    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

</head>

<body>
    <section id="header" class="mx-auto px-5 py-3">
        <div class="row">
            <div class="col-9">
                <h1 class="heading">Quotes Generator</h1>
            </div>
            <div class="col">
                <button class="new-quote btn btn-light mx-auto mt-2">Show Another Quote</button>
            </div>
        </div>
    </section>

    <section id="quote-area" class="mx-auto px-5 py-3">
        <div class="quote w-80 p-3 mt-4 border-bottom border-start border-3">
            <h2 class="quote-text">"Its all shits and giggle until someone giggles and shits"</h2>
            <h3 class="author-name text-end pt-5 me-3">- Bomb</h3>
        </div>
    </section>

    <!--bootstrap script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--jquery script-->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <!--native script-->
    <script src="script.js"></script>
</body>

</html>
